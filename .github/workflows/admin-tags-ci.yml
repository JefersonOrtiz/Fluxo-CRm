name: CI AdministraÃ§Ã£o e Tags

on:
  push:
    branches: [feature/admin-ui-tags]
  pull_request:
    branches: [migracao-postgresql]

permissions:
  contents: read

concurrency:
  group: admin-tags-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validar AdministraÃ§Ã£o, ConfiguraÃ§Ãµes e Tags
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tester:ci_password_only@127.0.0.1:55432/jfcrm_admin_tags_ci
      MIGRATIONS_TEST_ALLOWED: 'true'
      INTEGRATION_TEST_ALLOWED: 'true'
      JWT_SECRET: ci_only_jwt_secret_with_at_least_32_characters
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CORS_ORIGIN: http://localhost:8080
      AI_PROVIDER: mock
      OPENAI_ENABLED: 'false'
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: jfcrm_admin_tags_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d jfcrm_admin_tags_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Instalar dependências da API
        run: npm --prefix backend ci

      - name: Impedir artefatos Aurora BYOK
        shell: bash
        run: |
          test ! -e backend/migrations/0010_aurora_multi_provider_byok.sql
          test ! -e backend/src/aurora-credentials.mjs
          ! grep -R -n -E 'encryptAuroraProviderCredential|decryptAuroraProviderCredential|/api/aurora/provider' backend/src/security.mjs backend/src/app.mjs

      - name: Validar sintaxe e testes frontend
        run: npm run check

      - name: Executar testes backend seguros
        shell: bash
        run: |
          mapfile -t tests < <(
            find backend/tests -maxdepth 1 -type f -name '*.mjs' \
              ! -name '*.integration.test.mjs' \
              -print | sort
          )
          node --test --test-concurrency=1 "${tests[@]}"

      - name: Executar testes específicos de Tags
        run: node --test --test-concurrency=1 backend/tests/tags.endpoint.test.mjs

      - name: Validar PostgreSQL descartável e schema de Tags
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { Pool } from 'pg';
          import { runMigrations } from './backend/src/migrations.mjs';

          const url = new URL(process.env.DATABASE_URL);
          if (url.protocol !== 'postgresql:' || url.hostname !== '127.0.0.1' || url.port !== '55432' || url.pathname !== '/jfcrm_admin_tags_ci') {
            throw new Error('DATABASE_URL não corresponde ao PostgreSQL descartável autorizado');
          }
          if (url.username !== 'tester') throw new Error('usuário PostgreSQL não autorizado');

          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          try {
            await runMigrations(pool);
            const result = await pool.query(`
              SELECT column_name, data_type
              FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'tags' AND column_name = 'color'
            `);
            if (result.rowCount !== 1 || result.rows[0].data_type !== 'character varying') {
              throw new Error('schema de Tags sem a coluna color esperada');
            }
          } finally {
            await pool.end();
          }
          NODE

      - name: Verificar diferenças de whitespace
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
            if ! git show-ref --verify --quiet "refs/remotes/${base_ref}"; then
              git fetch --no-tags origin "refs/heads/${GITHUB_BASE_REF}:refs/remotes/${base_ref}"
            fi
            base_commit="$(git merge-base HEAD "${base_ref}")"
            git diff --check "${base_commit}" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
