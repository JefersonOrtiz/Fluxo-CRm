name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar apenas os arquivos públicos
        run: |
          mkdir -p public-site
          cp index.html public-site/
          cp -R css js assets shared public-site/
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
