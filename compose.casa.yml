
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluxo_crm_casa
      POSTGRES_USER: fluxo_casa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_casa_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo_casa -d fluxo_crm_casa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 3001
      NODE_ENV: development
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://fluxo_casa:${POSTGRES_PASSWORD}@postgres:5432/fluxo_crm_casa
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?Defina BOOTSTRAP_SECRET}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_casa_data:
