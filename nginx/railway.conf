server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /js/runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.FLUXO_CONFIG=Object.freeze({mode:"api",apiBaseUrl:"/api"});document.documentElement.dataset.fluxoMode="api";document.documentElement.dataset.authState="pending";';
    }

    location /api/ {
        resolver [fd12::10] valid=30s ipv6=on;
        set $api_upstream resourceful-happiness.railway.internal:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
