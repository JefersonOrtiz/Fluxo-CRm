server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /js/runtime-config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store";
    return 200 'window.FLUXO_CONFIG=Object.freeze({mode:"api",apiBaseUrl:"/api"});document.documentElement.dataset.fluxoMode="api";document.documentElement.dataset.authState="pending";';
  }
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
}
