server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = / { try_files /index.html =404; }
  location = /index.html { try_files $uri =404; }
  location ~ ^/(js/[a-zA-Z0-9-]+\.js|css/[a-zA-Z0-9-]+\.css|shared/plans\.js|assets/[a-zA-Z0-9_/-]+\.(png|webp|jpe?g|svg|ico|woff2?))$ { try_files $uri =404; }
  location / { return 404; }
}
